<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyStudy - محرك البحث التعليمي</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            📚 MyStudy
        </div>

        <p>
            محرك بحثك التعليمي الذكي
        </p>
    </header>


    <main class="container">

        <section class="hero">

            <h1>
                ابحث وتعلّم مع MyStudy
            </h1>

            <p>
                ابحث عن المعلومات والدروس والمواضيع التعليمية بسهولة.
            </p>


            <form id="searchForm" class="search-box">

                <input
                    id="searchInput"
                    type="search"
                    placeholder="ماذا تريد أن تتعلم؟"
                    autocomplete="off"
                >

                <button
                    id="searchButton"
                    type="submit">
                    🔎 بحث
                </button>

            </form>

        </section>


        <section class="results-section">

            <h2>
                نتائج البحث
            </h2>

            <div id="results">

                <div class="empty-state">
                    اكتب موضوعًا في مربع البحث للبدء.
                </div>

            </div>

        </section>


        <section class="quick-section">

            <h2>
                بحث سريع
            </h2>

            <div class="quick-buttons">

                <button onclick="searchWikipedia('الرياضيات')">
                    📐 الرياضيات
                </button>

                <button onclick="searchWikipedia('اللغة الفرنسية')">
                    🇫🇷 الفرنسية
                </button>

                <button onclick="searchWikipedia('العلوم')">
                    🔬 العلوم
                </button>

                <button onclick="searchWikipedia('التاريخ')">
                    📖 التاريخ
                </button>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 MyStudy — منصة تعليمية
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
